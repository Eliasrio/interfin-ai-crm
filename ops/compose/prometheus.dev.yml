# prometheus.dev.yml — ЛОКАЛЬНЫЙ скрейп для docker-compose.monitoring.yml
# (dev-проверка критерия M11 «метрики видны, алерты срабатывают»).
# Prod-версия — ops/prometheus/prometheus.yml (dns_sd по Swarm-сервисам).

global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: crm-app
    static_configs:
      - targets: [app:9091]

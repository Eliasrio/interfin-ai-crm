; pgbouncer.ini — пул соединений перед PostgreSQL (M11 §11.3).
;
; transaction mode — ИМЕННО из-за него жёсткое правило CLAUDE.md §4.2:
; соединение возвращается в пул после каждой транзакции, server-side
; prepared statements «переезжали» бы между клиентами. Приложение поэтому
; работает строго в pgx SimpleProtocol (+ GORM PrepareStmt=false);
; подтверждение под нагрузкой — AQ²-3 (internal/db/load_test.go через
; pgbouncer, см. docs/ops/provisioning.md).

[databases]
; app подключается сюда: POSTGRES_DSN=postgres://crm:...@pgbouncer:6432/interfin
interfin = host=postgres-primary port=5432 dbname=interfin

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
; auth_file приезжает из Docker secret pgbouncer_userlist.
; ВАЖНО: pgbouncer НЕ поддерживает комментарий в строке со значением —
; «;» уходит в само значение и валит парсер (поймано при первом боевом
; деплое). Комментарии — только отдельными строками.
auth_file = /etc/pgbouncer/userlist.txt

; §11.3: transaction mode; default_pool_size == database.max_open_conns
pool_mode = transaction
default_pool_size = 36
max_client_conn = 200
reserve_pool_size = 4
reserve_pool_timeout = 3

; SET/DISCARD между клиентами не протекают
server_reset_query = DISCARD ALL
server_reset_query_always = 0

log_connections = 0
log_disconnections = 0
ignore_startup_parameters = extra_float_digits

; liveness для HEALTHCHECK
admin_users = pgbouncer_admin

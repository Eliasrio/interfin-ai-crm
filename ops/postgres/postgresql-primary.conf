# postgresql-primary.conf — надстройка над дефолтом образа (M11 §11.3).
# Подключается флагом: postgres -c config_file=/etc/postgresql/postgresql-primary.conf
# (include дефолта ниже). Значения — под целевой сервер 4 vCPU / 8–16 ГБ.

# --- база: дефолтный конфиг образа ---
include = '/var/lib/postgresql/data/postgresql.conf'

# --- streaming replication (§11.3) ---
wal_level = replica
max_wal_senders = 5            # replica + pg_basebackup + запас
wal_keep_size = 512MB          # окно догоняющей реплики без archive-fetch
hot_standby = on

# --- WAL archiving → S3 sa-east-1 (PITR, AQ²-8) ---
archive_mode = on
archive_command = 'wal-g wal-push %p'
# RPO ≈ 5 мин (AQ²-8): сегмент уходит в S3 не позже, чем раз в 60 с, даже
# при слабом трафике — потеря первички ограничена последней минутой WAL.
archive_timeout = 60

# --- подключения: приложение ходит ЧЕРЕЗ pgbouncer (transaction mode) ---
# default_pool_size 36 (pgbouncer) + репликация + суперпользователь < 60.
max_connections = 60

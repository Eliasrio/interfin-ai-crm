# crm.conf — периметр Interfin AI-CRM (M11 §13, AQ²-10).
#
# Снаружи открыты ТОЛЬКО эти server-блоки (80 → redirect, 443 → приложение).
# Домен: crm.interfin.example → ЗАМЕНИТЬ на боевой при провижининге
# (docs/ops/provisioning.md, шаг 6); сертификаты — Let's Encrypt/certbot
# на хосте, смонтированы в /etc/letsencrypt.

upstream crm_app {
    # Swarm DNS балансирует между репликами сервиса app (VIP).
    server app:8080;
}

upstream crm_metrics {
    # Отдельный listener метрик приложения (monitoring.prometheus_port).
    server app:9091;
}

# 80: ACME-челленджи certbot + редирект всего остального на https.
server {
    listen 80;
    server_name crm.interfin.example;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name crm.interfin.example;

    ssl_certificate     /etc/letsencrypt/live/crm.interfin.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.interfin.example/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # mTLS ТОЛЬКО для /metrics (AQ²-10): запрашиваем клиентский сертификат
    # опционально на уровне server (иначе он требовался бы и для вебхука
    # Telegram), а обязательность проверяем в location /metrics.
    ssl_client_certificate /etc/nginx/metrics-ca/ca.crt;
    ssl_verify_client optional;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # EP-03 (ТЗ панели Эммы §2.3): загрузка файлов базы знаний до 50 МБ.
    # Без этого nginx резал бы тела на дефолтном 1m ещё до приложения
    # (приложение держит тот же лимит 50 МБ через MaxBytesReader).
    client_max_body_size 50m;

    # nginx-health — локальный healthcheck контейнера (не проксируется).
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # --- /metrics: двойной замок (AQ²-10) ---
    # 1) mTLS: клиент без валидного сертификата от нашего CA → 403;
    # 2) IP allowlist (metrics_ip_allowlist из SRS §14): чужой IP → 403.
    # Третий слой — allowlist в самом приложении (internal/metrics).
    location /metrics {
        if ($ssl_client_verify != SUCCESS) {
            return 403 '{"error":"client certificate required","code":"ERR_METRICS_FORBIDDEN"}';
        }
        # metrics_ip_allowlist: офисный/VPN-периметр INTERFIN — ЗАМЕНИТЬ
        # на реальные адреса при провижининге.
        allow 127.0.0.1;
        allow 10.0.0.0/8;       # внутренние сети (VPN)
        deny  all;              # чужой IP → 403 (AQ²-10)

        proxy_pass http://crm_metrics/metrics;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- Grafana за тем же TLS (доступ по паролю Grafana) ---
    location /grafana/ {
        proxy_pass http://grafana:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --- WebSocket Kanban (§10) ---
    location /ws/ {
        proxy_pass http://crm_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Heartbeat §10.2: ping/pong каждые 30 с — 90 с с запасом.
        proxy_read_timeout 90s;
    }

    # --- всё остальное: API, вебхуки, статика React ---
    location / {
        proxy_pass http://crm_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # Вебхук Telegram (§4.4): апстрим отвечает мгновенно, 10 с — запас.
        proxy_read_timeout 60s;
    }
}

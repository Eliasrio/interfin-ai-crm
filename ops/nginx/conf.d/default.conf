# default.conf — сознательно ПЕРЕКРЫВАЕТ штатную заглушку образа nginx.
#
# Healthcheck контейнера ходит на http://localhost/nginx-health, и запрос с
# Host: localhost матчится сервером `server_name localhost` из штатной
# заглушки (404) — Swarm бесконечно убивал здоровый контейнер (поймано при
# первом боевом деплое). Этот файл монтируется Swarm-конфигом поверх
# штатного и отвечает healthcheck'у сам; всё остальное на нём — 404.
server {
    listen 80;
    server_name localhost;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}

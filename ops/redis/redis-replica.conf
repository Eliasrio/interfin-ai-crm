# redis-replica.conf — реплики (M11 §11.1). Отличие от master: replicaof.
# ВАЖНО: replica-announce-ip замещается именем КОНКРЕТНОГО сервиса
# (redis-replica-1 / redis-replica-2) в команде сервиса stack-файла.

port 6379
bind 0.0.0.0
protected-mode no

appendonly yes
appendfsync everysec

maxmemory 1gb
maxmemory-policy noeviction

replicaof redis-master 6379
# Sentinel может промоутить реплику в master при failover — настройки
# идентичны master'у, чтобы промоушен ничего не менял.

# redis-master.conf — master узел (M11 §11.1: 1 master + 2 replica + 3 Sentinel).
# Пароль НЕ здесь (CLAUDE.md §4.9): --requirepass/--masterauth дописывает
# команда сервиса из Docker secret redis_password. Все узлы (master и обе
# реплики) используют ОДИН пароль — после failover любой может стать master'ом.

port 6379
# Слушаем только backend-сеть Docker; наружу порт не публикуется (§13).
bind 0.0.0.0
protected-mode no

# Надёжность очереди Asynq: AOF переживает рестарт контейнера.
appendonly yes
appendfsync everysec

# Память: под очередь и pub/sub на сервере 8–16 ГБ.
maxmemory 1gb
# noeviction: Asynq-задачи терять нельзя — при переполнении пишущие команды
# получают ошибку, вебхук уходит в graceful degradation (§11.2), сообщения
# копятся в Postgres. Eviction молча выкидывал бы задачи.
maxmemory-policy noeviction

# Failover: реплика объявляет себя по имени сервиса (DNS Swarm-сети),
# не по внутреннему IP контейнера.
replica-announce-ip redis-master

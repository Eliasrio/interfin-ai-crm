# sentinel.conf — ШАБЛОН узла Sentinel (M11 §11.1: 3 узла, кворум 2).
#
# Sentinel ПЕРЕПИСЫВАЕТ свой конфиг на лету (известные реплики, эпохи),
# поэтому сервис копирует шаблон в writable-каталог перед стартом — см.
# команду сервиса в docker-compose.prod.yml.
#
# Пароль мастера дописывает команда сервиса из Docker secret redis_password:
#   sentinel auth-pass mymaster <пароль>

port 26379
bind 0.0.0.0

# Docker-сети: узлы видят друг друга по именам сервисов, не по IP.
sentinel resolve-hostnames yes
sentinel announce-hostnames yes

# Кворум 2 из 3: failover объявляется, когда мастера не видят двое.
sentinel monitor mymaster redis-master 6379 2

# Мастер считается упавшим после 5 с тишины; вместе со временем выбора
# нового мастера полный failover укладывается в ~10 с. Критерий IQ-7
# (Kanban живёт < 5 с) выполняется НЕ скоростью failover, а polling
# fallback'ом WS Hub — он срабатывает мгновенно при обрыве pub/sub.
sentinel down-after-milliseconds mymaster 5000
sentinel failover-timeout mymaster 60000
sentinel parallel-syncs mymaster 1

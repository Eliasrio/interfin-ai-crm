# Interfin AI-CRM — dev-окружение (SRS §13.1: запуск `docker compose up`).
# Критерий AQ²-9: все сервисы healthy < 60 сек.
# Пароли ниже — только для локальной разработки, это не секреты prod.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: interfin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d interfin"]
      interval: 5s
      timeout: 3s
      retries: 10

  # M11 (AQ²-3): pgbouncer в transaction mode — как в prod (§11.3).
  # Через него гоняется полный load-тест SimpleProtocol:
  #   POSTGRES_TEST_DSN=postgres://postgres:postgres@localhost:6432/interfin_test \
  #     go test ./internal/db/ -run TestSimpleProtocolUnderLoad -v
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p2
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      AUTH_TYPE: plain          # dev: plain к клиенту, scram к серверу
      POOL_MODE: transaction    # §11.3 — режим, ломающий prepared statements (CLAUDE.md §4.2)
      DEFAULT_POOL_SIZE: "36"   # §11.3
      MAX_CLIENT_CONN: "200"
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      CONFIG_PATH: /app/config/config.yaml
      HTTP_PORT: "8080"
      POSTGRES_DSN: postgres://postgres:postgres@postgres:5432/interfin?sslmode=disable
      REDIS_ADDR: redis:6379
      # M2: значения берутся из .env (см. .env.example и README «Telegram
      # webhook локально»). Секреты в compose-файл не вписывать (CLAUDE.md §4.9).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      # M3: воркер + Claude (ключ обязателен, chat_id алертов — нет)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TELEGRAM_MANAGER_CHAT_ID: ${TELEGRAM_MANAGER_CHAT_ID:-}
      # M4: RAG-эмбеддинги Voyage (обязательная)
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      # M6: крипто-шлюз CryptoBot; сеть по умолчанию testnet (безопасный дефолт)
      CRYPTOBOT_TESTNET_TOKEN: ${CRYPTOBOT_TESTNET_TOKEN:-}
      CRYPTOBOT_MAINNET_TOKEN: ${CRYPTOBOT_MAINNET_TOKEN:-}
      CRYPTOBOT_USE_TESTNET: ${CRYPTOBOT_USE_TESTNET:-true}
      # M7: RSA-пара RS256 приходит Docker secrets (CLAUDE.md §4.9, задача
      # M7-1) — в env только ПУТИ. Сгенерировать: ./scripts/gen_jwt_keys.sh
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public
      # M8: соль LGPD erasure (§9.3, обязательная) — из .env
      LGPD_SALT: ${LGPD_SALT:-}
      # EP-03: файлы панели Эммы — именованный том, переживает пересборку
      EMMA_DATA_DIR: /app/data/emma
    volumes:
      - emma_data:/app/data/emma
    secrets:
      - jwt_private
      - jwt_public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

# M7: ключи JWT — единственный источник (CLAUDE.md §4.9). Файлы создаёт
# ./scripts/gen_jwt_keys.sh; каталог secrets/ и *.pem в .gitignore.
# В Swarm (prod, M11) file-секреты заменяются на docker secret create.
secrets:
  jwt_private:
    file: ./secrets/jwt_private.pem
  jwt_public:
    file: ./secrets/jwt_public.pem

volumes:
  pgdata:
  miniodata:
  emma_data: # EP-03: data/emma/{kb,files} — файлы панели Эммы
